<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e00000"/>
      <stop offset="100%" stop-color="#a80000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Fundo arredondado -->
  <rect x="0" y="0" width="256" height="256" rx="44" ry="44" fill="url(#bg)"/>

  <!-- Balão de chat com cauda no canto inferior esquerdo -->
  <path
    d="M60,46 L196,46 Q226,46 226,76 L226,168 Q226,198 196,198 L114,198 L76,228 L72,198 L60,198 Q30,198 30,168 L30,76 Q30,46 60,46 Z"
    fill="white"
    filter="url(#shadow)"
  />

  <!-- "ASSISTENTE" pequeno acima -->
  <text
    x="128"
    y="88"
    font-family="'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-size="11"
    fill="#e87070"
    text-anchor="middle"
    letter-spacing="4"
  >ASSISTENTE</text>

  <!-- Texto "IA" grande -->
  <text
    x="128"
    y="165"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="94"
    fill="#CC0000"
    text-anchor="middle"
    letter-spacing="-3"
  >IA</text>
</svg>
